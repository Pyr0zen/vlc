# Windows 64-bit build of the redesign branch.
# Mirrors VideoLAN's own "win64" job (extras/ci/gitlab-ci.yml): same Docker image,
# same build script (extras/package/win32/build.sh) and the same prebuilt contribs.
# The release workflow (release.yml) calls it for the "public" profile (redesign/CI_RELEASE_NOTES.md).
name: build-windows

on:
  push:
    branches: [redesign]
    # documentation-only pushes (status, plans, notes) do not need a build
    paths-ignore:
      - 'redesign/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'CREDITS.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      brand:
        # brand layer (modules/gui/qt/util/brand.hpp): vlc = VLC's name and cone (Sticky's test
        # builds), public = "Cone" and its logo. Pushes build "public" (Decision 50).
        description: 'Brand profile'
        type: choice
        options: [vlc, public]
        default: public
  workflow_call:
    inputs:
      brand:
        type: string
        default: public
      release:
        # release build: the installer must succeed, both packages are handed to the caller as the
        # cone-release-files artifact, and the compiler cache is read but not saved (a tag's cache
        # can not be restored by any later run)
        type: boolean
        default: false
      cache-branch:
        # the branch whose compiler cache the build starts from (a tag run has no branch)
        type: string
        default: ''

concurrency:
  # one queue per branch and brand profile: a vlc and a public build of the same branch run side by
  # side; github.workflow is the caller's name when release.yml calls this, so a release never
  # cancels a normal build
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.brand || 'public' }}
  cancel-in-progress: true

env:
  # Keep in sync with VLC_WIN64_IMAGE in extras/ci/gitlab-ci.yml
  VLC_IMAGE: registry.videolan.org/vlc-debian-win64-posix:20260611225331
  # brand profile: the workflow_dispatch / workflow_call input, "public" for pushes (Decision 50)
  VLC_BRAND: ${{ inputs.brand || 'public' }}
  # ccache used when the build image has none: pinned release and its SHA-256
  CCACHE_VERSION: 4.10.2
  CCACHE_SHA256: 80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18

jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # get-contrib-sha.sh needs the history

      - name: Contrib SHA and prebuilt URL
        id: sha
        run: |
          SHA=$(extras/ci/get-contrib-sha.sh win64)
          # our own commits change the packaging scripts (brand layer: extras/package/win32), which
          # moves VLC's contrib key to a commit VideoLAN never built; when none of our commits
          # touches the contribs themselves, use the upstream key (VLC's master in this fork)
          UPSTREAM=$(git merge-base HEAD origin/master)
          if ! git merge-base --is-ancestor "$SHA" "$UPSTREAM"              && [ -z "$(git rev-list -1 HEAD ^"$UPSTREAM" -- contrib extras/tools extras/ci)" ]; then
            SHA=$(git rev-list -1 "$UPSTREAM" -- contrib extras/tools extras/ci extras/package/win32)
            echo "Contrib key from upstream: $SHA"
          fi
          URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${SHA}.tar.zst"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if extras/ci/check-url.sh "$URL"; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Prebuilt contribs found: $URL"
          else
            echo "No prebuilt contribs for $SHA, contribs will be built from source"
          fi

      - name: Cache contribs built from source
        if: steps.sha.outputs.url == ''
        uses: actions/cache@v4
        with:
          path: |
            contrib/x86_64-w64-mingw32
            contrib/tarballs
          key: contrib-win64-${{ steps.sha.outputs.sha }}

      - name: Cache extra tools
        uses: actions/cache@v4
        with:
          path: extras/tools/build
          key: tools-win64-${{ steps.sha.outputs.sha }}

      # Compiler cache, one per branch and brand profile. Keys are "ccache-win64-<brand>:<branch>:<commit>"
      # (":" can not appear in a branch name, so one branch's prefix never matches another's). A run
      # restores, in order: its own branch and brand, its own branch with the other brand, then the
      # redesign branch (same brand first). Other branches can read redesign's caches because it is
      # the default branch; they can never read each other's.
      - name: Compiler cache keys
        id: cachekey
        env:
          CACHE_BRANCH: ${{ inputs.cache-branch || github.ref_name }}
        run: |
          OTHER=$([ "$VLC_BRAND" = public ] && echo vlc || echo public)
          {
            echo "key=ccache-win64-$VLC_BRAND:$CACHE_BRANCH:$GITHUB_SHA"
            echo "restore<<EOF"
            echo "ccache-win64-$VLC_BRAND:$CACHE_BRANCH:"
            echo "ccache-win64-$OTHER:$CACHE_BRANCH:"
            echo "ccache-win64-$VLC_BRAND:redesign:"
            echo "ccache-win64-$OTHER:redesign:"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Compiler cache for branch '$CACHE_BRANCH', brand '$VLC_BRAND'"

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore }}

      - name: Compiler cache restored
        env:
          MATCHED: ${{ steps.ccache.outputs.cache-matched-key }}
          WANTED: ${{ steps.cachekey.outputs.key }}
        run: |
          if [ -z "$MATCHED" ]; then
            MSG="no compiler cache found: cold build, every file is compiled"
          elif [ "$MATCHED" = "$WANTED" ]; then
            MSG="compiler cache of this exact commit: $MATCHED"
          else
            MSG="compiler cache restored from $MATCHED"
          fi
          echo "$MSG"
          echo "Compiler cache: $MSG" >> "$GITHUB_STEP_SUMMARY"
          du -sh .ccache 2>/dev/null || true

      # without it (download failed) the build still runs, only without the compiler cache
      - name: ccache for the build image
        continue-on-error: true
        run: |
          # the image's own ccache is used when it has one (win64-build.sh); this one otherwise
          mkdir -p .ccache-tool
          curl -sSLf -o /tmp/ccache.tar.xz \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-linux-x86_64.tar.xz"
          echo "$CCACHE_SHA256  /tmp/ccache.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ccache.tar.xz -C .ccache-tool --strip-components=1 "ccache-$CCACHE_VERSION-linux-x86_64/ccache"

      - name: Pull build image
        run: docker pull "$VLC_IMAGE"

      - name: Build in VideoLAN's image
        run: |
          # run as the runner's user so the checkout, caches and build output have one owner
          mkdir -p .ccache
          # the public profile's own version (Decision 58): a vX.Y.Z tag sets it, otherwise 0.1.0
          BRAND_VERSION=""
          case "$GITHUB_REF" in refs/tags/v*) BRAND_VERSION="${GITHUB_REF_NAME#v}" ;; esac
          if [ -n "$BRAND_VERSION" ] && ! echo "$BRAND_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::tag $GITHUB_REF_NAME is not vX.Y.Z: the build uses the default version"
            BRAND_VERSION=""
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            -e VLC_PREBUILT_CONTRIBS_URL="${{ steps.sha.outputs.url }}" \
            -e VLC_BRAND="$VLC_BRAND" \
            -e BRAND_VERSION="$BRAND_VERSION" \
            "$VLC_IMAGE" .github/scripts/win64-build.sh build
          df -h /

      - name: Compiler cache result
        if: ${{ !cancelled() }}
        run: |
          SUMMARY=$(cat .ccache-summary.txt 2>/dev/null || echo "ccache: no statistics (the build did not reach ccache)")
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          du -sh .ccache 2>/dev/null || true

      # saved even when the build failed, so the next run starts from what was compiled
      - name: Save compiler cache
        if: ${{ !cancelled() && !inputs.release && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.cachekey.outputs.key }}

      - name: Unpack zip so the artifact is a single zip
        run: |
          ls -la win64/*.zip
          mkdir dist
          unzip -q win64/vlc-*-win64.zip -d dist
          ls dist dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VLC_BRAND == 'public' && 'vlc-redesign-win64-public' || 'vlc-redesign-win64' }}
          path: dist/
          retention-days: 14

      # brand layer: Cone's NSIS installer, to test installing it next to an installed VLC
      # (redesign/CONE_RELEASE_NOTES.md); a failure here keeps a normal build green, a release fails
      - name: Cone installer
        if: env.VLC_BRAND == 'public'
        continue-on-error: ${{ !inputs.release }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/build" -w /build -e HOME=/tmp \
            "$VLC_IMAGE" .github/scripts/win64-build.sh installer
          ls -la win64/*.exe

      - uses: actions/upload-artifact@v4
        if: env.VLC_BRAND == 'public' && hashFiles('win64/cone-*-win64.exe') != ''
        with:
          name: cone-installer-win64
          path: win64/cone-*-win64.exe
          retention-days: 14

      # release.yml: both packages exactly as built, for the release job of the same run only
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: cone-release-files
          path: |
            win64/vlc-*-win64.zip
            win64/cone-*-win64.exe
          if-no-files-found: error
          retention-days: 1
